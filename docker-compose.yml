# Local development services. Credentials come from .env (copy .env.example); compose fails if it is missing.
services:
  mysql:
    image: mysql:8.4
    # MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD are read from .env.
    env_file: [.env]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
  meilisearch:
    image: getmeili/meilisearch:v1.14
    # MEILI_MASTER_KEY is read from .env.
    env_file: [.env]
    ports: ["7700:7700"]
    volumes: [meili-data:/meili_data]

volumes:
  mysql-data:
  qdrant-data:
  meili-data:
